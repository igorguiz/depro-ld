name: Atualizar Contratos.gov.br e publicar DEPRO-LD
on:
  workflow_dispatch:
  schedule:
    - cron: '20 10 * * *'
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Consultar Contratos.gov.br e validar dados
        run: python scripts/atualizar_contratos.py
      - name: Publicar arquivo de dados no repositório
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/contratos.json
          if ! git diff --cached --quiet; then
            git commit -m 'Atualizar dados públicos dos contratos'
            git push
          else
            echo 'Sem mudanças.'
          fi
